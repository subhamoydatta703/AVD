[project]
name = "avd"
version = "0.1.0"
description = "Resumable multilingual video dubbing into English with Gemini translation"
readme = "README.md"
authors = [
    { name = "Subhamoy Datta", email = "subhamoydatta99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.75,<2",
    "python-dotenv>=1.1,<2",
    "edge-tts>=7.2,<8",
    "huggingface-hub>=0.30,<1",
    "numpy<2",
    "openai-whisper>=20250625",
    "regex>=2026.9.10",
    "torch>=2.14.0",
    "yt-dlp>=2026.8.19",
    "tqdm>=4.67",
    "faster-whisper>=1.2,<2",
]

[project.scripts]
avd = "avd:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "avd"
